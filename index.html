<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albums</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0d;
      --surface: #161618;
      --surface2: #1e1e21;
      --surface3: #28282d;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0ede8;
      --text2: #9a9899;
      --text3: #5c5a5b;
      --accent: #d4956a;
      --accent2: #c27a4e;
      --accent-glow: rgba(212,149,106,0.15);
      --sidebar-w: 220px;
      --radius: 10px;
      --font: 'DM Sans', sans-serif;
      --font-serif: 'DM Serif Display', serif;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

    /* ─── Layout ─── */
    #app { display: flex; height: 100vh; }

    /* ─── Sidebar ─── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    .sidebar-header {
      padding: 20px 18px 12px;
      padding-top: 44px; /* macOS traffic lights */
    }

    .sidebar-logo {
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--text);
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .sidebar-logo span { color: var(--accent); font-style: italic; }

    .sidebar-subtitle {
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .sidebar-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text3);
      padding: 16px 18px 6px;
      font-weight: 600;
      -webkit-app-region: no-drag;
    }

    .albums-list { flex: 1; overflow-y: auto; padding: 0 8px; -webkit-app-region: no-drag; }
    .albums-list::-webkit-scrollbar { width: 4px; }
    .albums-list::-webkit-scrollbar-track { background: transparent; }
    .albums-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

    .album-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text2);
      transition: all 0.15s;
      position: relative;
      user-select: none;
      margin-bottom: 1px;
    }

    .album-item:hover { background: var(--surface2); color: var(--text); }
    .album-item.active { background: var(--accent-glow); color: var(--accent); font-weight: 500; }
    .album-item.active .album-icon { color: var(--accent); }

    .album-icon { font-size: 15px; flex-shrink: 0; opacity: 0.7; }
    .album-item.active .album-icon { opacity: 1; }

    .album-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .album-count {
      font-size: 11px;
      color: var(--text3);
      background: var(--surface3);
      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .album-item.active .album-count { background: rgba(212,149,106,0.2); color: var(--accent); }

    .album-ctx-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 14px;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .album-item:hover .album-ctx-btn { opacity: 1; }
    .album-ctx-btn:hover { color: var(--text); background: var(--surface3); }

    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
      -webkit-app-region: no-drag;
    }

    .new-album-btn {
      width: 100%;
      background: none;
      border: 1px dashed var(--border2);
      color: var(--text3);
      font-family: var(--font);
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
    }

    .new-album-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

    /* ─── Main area ─── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

    /* ─── Toolbar ─── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(12,12,13,0.9);
      backdrop-filter: blur(10px);
    }

    .toolbar-title { font-family: var(--font-serif); font-size: 22px; color: var(--text); flex: 1; }
    .toolbar-title span { color: var(--accent); font-style: italic; }
    .toolbar-count { font-size: 12px; color: var(--text3); margin-left: 2px; font-family: var(--font); font-style: normal; }

    .toolbar-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text2);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .toolbar-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .toolbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .toolbar-btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }

    /* ─── Photo Grid ─── */
    #content { flex: 1; overflow-y: auto; padding: 24px; }
    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
      group: true;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-card:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .photo-card:hover .photo-overlay { opacity: 1; }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .photo-card:hover img { transform: scale(1.05); }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: flex-end;
      padding: 10px;
    }

    .photo-name {
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .photo-delete-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .photo-delete-btn:hover { background: rgba(220,60,60,0.7); }

    /* ─── Empty State ─── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      color: var(--text3);
      min-height: 300px;
    }

    .empty-icon { font-size: 56px; opacity: 0.3; }
    .empty-title { font-family: var(--font-serif); font-size: 22px; color: var(--text2); }
    .empty-sub { font-size: 13px; text-align: center; max-width: 280px; line-height: 1.6; }

    /* ─── Lightbox ─── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #lightbox.open { display: flex; }

    .lb-image-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: calc(100vh - 80px);
    }

    #lb-img {
      max-width: calc(100vw - 160px);
      max-height: calc(100vh - 120px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
      animation: lbIn 0.2s ease-out;
    }

    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      backdrop-filter: blur(10px);
    }

    .lb-nav-btn:hover { background: rgba(255,255,255,0.15); }
    .lb-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .lb-nav-btn.prev { left: 24px; }
    .lb-nav-btn.next { right: 24px; }

    .lb-close {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .lb-close:hover { background: rgba(220,60,60,0.5); }

    .lb-footer {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .lb-counter { font-size: 13px; color: var(--text3); }
    .lb-filename { font-size: 13px; color: var(--text2); }

    /* ─── Modal ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 28px;
      width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h2 { font-family: var(--font-serif); font-size: 20px; margin-bottom: 16px; }
    .modal input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .modal input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .modal-actions button { padding: 9px 20px; border-radius: 7px; border: none; cursor: pointer; font-family: var(--font); font-size: 13.5px; transition: all 0.15s; }
    .modal-cancel { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2) !important; }
    .modal-cancel:hover { background: var(--surface3); color: var(--text); }
    .modal-confirm { background: var(--accent); color: white; font-weight: 500; }
    .modal-confirm:hover { background: var(--accent2); }

    /* ─── Context Menu ─── */
    .ctx-menu {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 5px;
      z-index: 3000;
      min-width: 160px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: none;
    }

    .ctx-menu.open { display: block; }

    .ctx-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 9px;
      transition: all 0.1s;
    }

    .ctx-item:hover { background: var(--surface2); color: var(--text); }
    .ctx-item.danger { color: #e05555; }
    .ctx-item.danger:hover { background: rgba(220,60,60,0.1); }
    .ctx-separator { height: 1px; background: var(--border); margin: 4px 0; }

    /* ─── Loading ─── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12,12,13,0.8);
      z-index: 100;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--surface3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
  </style>
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Photo<span>Albums</span></div>
      <div class="sidebar-subtitle">Library</div>
    </div>
    <div class="sidebar-section-label">Albums</div>
    <div class="albums-list" id="albumsList"></div>
    <div class="sidebar-footer">
      <button class="new-album-btn" id="newAlbumBtn">
        <span>＋</span> New Album
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="toolbar">
      <div class="toolbar-title" id="toolbarTitle">All <span>Photos</span></div>
      <button class="toolbar-btn primary" id="importBtn">
        ↑ Import Photos
      </button>
    </div>
    <div id="content">
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </main>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lb-image-wrap">
    <button class="lb-nav-btn prev" id="lbPrev">‹</button>
    <img id="lb-img" src="" alt="" />
    <button class="lb-nav-btn next" id="lbNext">›</button>
  </div>
  <div class="lb-footer">
    <span class="lb-filename" id="lbFilename"></span>
    <span class="lb-counter" id="lbCounter"></span>
  </div>
</div>

<!-- New Album Modal -->
<div class="modal-overlay" id="newAlbumModal">
  <div class="modal">
    <h2 id="modalTitle">New Album</h2>
    <input type="text" id="albumNameInput" placeholder="Album name…" maxlength="60" />
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-confirm" id="modalConfirm">Create</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" id="ctxRename">✏️ Rename</div>
  <div class="ctx-item danger" id="ctxDelete">🗑 Delete Album</div>
</div>

<script src="renderer.js"></script>
</body>
</html>
